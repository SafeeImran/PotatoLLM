document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ustify-content: space-between; padding: 0 10px 0 16px; border-bottom: 1px solid var(--pot-line);\">\n      <sc-if value=\"{{ sidebarOpen }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display: flex; align-items: center; gap: 9px; white-space: nowrap;\">\n          <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: -.5px; background: var(--pot-inv-bg); color: var(--pot-accent); padding: 3px 5px; border-radius: 4px;\">(_)<\u002Fspan>\n          <span style=\"font-weight: 800; font-size: 14.5px; letter-spacing: -.35px;\">PotatoLLM<\u002Fspan>\n          <span style=\"font-size: 9.5px; font-weight: 600; letter-spacing: .4px; color: var(--pot-sub); border: 1px solid var(--pot-line-strong); padding: 2px 4px; border-radius: 3px;\">v2.4<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <button sc-camel-on-click=\"{{ toggleSidebar }}\" title=\"open / close side panel\" style=\"width: 30px; height: 30px; flex: 0 0 30px; display: grid; place-items: center; border: 1px solid var(--pot-line-strong); background: var(--pot-bg); border-radius: 7px; cursor: pointer; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--pot-sub); transition: background .18s ease, color .18s ease, border-color .18s ease;\" style-hover=\"background: var(--pot-accent); color: #0d0d0d; border-color: var(--pot-accent-edge);\">{{ sidebarIcon }}<\u002Fbutton>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ sidebarOpen }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; overflow: hidden;\">\n\n        <div style=\"padding: 14px 16px 6px;\">\n          <div style=\"display: flex; align-items: center; gap: 8px; margin-bottom: 8px;\">\n            <span style=\"font-size: 9.5px; font-weight: 700; letter-spacing: 1.4px; color: var(--pot-sub);\">PINNED<\u002Fspan>\n            <span style=\"flex: 1 1 auto; font-family: 'JetBrains Mono', monospace; font-size: a value=\"{{ sysPrompt }}\" sc-camel-on-change=\"{{ onSysPrompt }}\" rows=\"5\" style=\"width: 100%; resize: none; border: 1px solid var(--pot-line-strong); border-radius: 10px; padding: 11px 12px; font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.6; background: var(--pot-field); transition: border-color .18s ease, background .18s ease;\" style-focus=\"border-color: var(--pot-accent-edge); background: var(--pot-bg);\"><\u002Ftextarea>\n\n          <div style=\"height: 1px; background: var(--pot-line); margin: 20px 0;\"><\u002Fdiv>\n\n          <div style=\"font-size: 9.5px; font-weight: 700; letter-spacing: 1.3px; color: var(--pot-sub); margin-bottom: 10px;\">THROUGHPUT<\u002Fdiv>\n          <div style=\"border: 1px solid var(--pot-line); border-radius: 10px; padding: 12px; background: var(--pot-field);\">\n            <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.15; letter-spacing: -.5px; color: var(--pot-ink); overflow: hidden; white-space: nowrap;\">{{ bigSpark }}<\u002Fdiv>\n            <div style=\"display: flex; justify-content: space-between; margin-top: 9px; font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; color: var(--pot-faint);\">\n              <span>tok/s {{ tps }}<\u002Fspan>\n              <span>ttft {{ ttft }}ms<\u002Fspan>\n              <span>p95 {{ p95 }}ms<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px;\">\n            <sc-for list=\"{{ stats }}\" as=\"st\" hint-placeholder-count=\"4\">\n              <div style=\"border: 1px solid var(--pot-line); border-radius: 10px; padding: 10px 11px;\">\n                <div style=\"font-size: 9px; font-weight: 700; letter-spacing: 1.1px; color: var(--pot-faint);\">{{ st.k }}<\u002Fdiv>\n                <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 600; letter-spacing: -.6px; margin-top: 3px;\">{{ st.v }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;'light' | 'dark'&quot;,&quot;section&quot;:&quot;Appearance&quot;}}\">\nconst BLOCKS = \"▁▂▃▄▅▆▇█\";\nconst SPIN = [\"|\", \"/\", \"-\", \"\\\\\"];\n\nconst SEED = [\n  { role: \"user\", text: \"Run the eval sweep on the tuber-7b checkpoint and tell me where it regressed.\", time: \"14:02\" },\n  { role: \"bot\", text: \"Sweep finished across 12 tasks.\\n\\n  arc-easy      91.4  ▲ 0.6\\n  gsm8k         74.2  ▼ 2.9\\n  humaneval     58.1  ▲ 1.2\\n\\nOnly gsm8k regressed. The failures cluster on multi-step arithmetic with unit conversion — 61% of them drop a carry in the final step.\", time: \"14:02\" },\n  { role: \"user\", text: \"What would you change first?\", time: \"14:05\" },\n  { role: \"bot\", text: \"Lower temperature to 0.3 for the math split and re-run. If the carry errors persist at low temperature it is a capability gap, not sampling noise — then the fix is data, not decoding.\", time: \"14:05\" }\n];\n\nconst REPLIES = [\n  \"Queued. I am holding the same decoding config so the comparison stays clean.\\n\\n  split: gsm8k · n=1319\\n  temp: 0.30 · top_p: 0.90\\n\\nFirst results land in about 40s — I will flag any item that flips from pass to fail.\",\n  \"Done. Carry errors dropped from 61% to 22% of failures, so most of it was sampling noise. The remaining 22% share one shape: two unit conversions in a single step.\\n\\nRecommendation — add ~4k synthetic conversion chains to the SFT mix before touching the architecture.\"\n];\n\nclass Component extends DCLogic {\n  state = {\n    theme: null, sidebarOpen: true, monitorOpen: false, modelOpen: false, focused: false,\n    query: \"\", filter: 0, draft: \"\", messages: SEED.slice(),\n    streaming: false, streamText: \"\", tick: 0, replyIdx: 0,\n    model: \"potato-2 · large\", activeChat: 1,\n    temp: 0.7, topP: 0.9, topK: 40, maxTokens: 2048,\n    sysPrompt: \"You are PotatoLLM, a terse research assistant. Show numbers before opinions.\",\n    hist: Array.from({ length: 44 }, (_, i) => 2 + Math.round(3 + 2.6 * Math.sin(i / 3.1) + Math.sin(i / 1.7)))\n  };\n\n  componentDidMount() {\n    this.timer = setInterval(() => {\n      this.setState(s => {\n        const base = s.streaming ? 6.4 : 2.2;\n        const amp = s.streaming ? 1.6 : 1.1;\n        const next = Math.max(0, Math.min(7, Math.round(base + amp * Math.sin(s.tick / 2.3) + (Math.random() * 2 - 1) * amp)));\n        return { tick: s.tick + 1, hist: s.hist.slice(1).concat(next) };\n      });\n    }, 150);\n  }\n  componentWillUnmount() { clearInterval(this.timer); clearInterval(this.stream); }\n\n  spark(n) { return this.state.hist.slice(-n).map(v => BLOCKS[v]).join(\"\"); }\n\n  send = () => {\n    const t = this.state.draft.trim();\n    if (!t || this.state.streaming) return;\n    const time = new Date().toTimeString().slice(0, 5);\n    const reply = REPLIES[this.state.replyIdx % REPLIES.length];\n    this.setState(s => ({\n      messages: s.messages.concat([{ role: \"user\", text: t, time }]),\n      draft: \"\", streaming: true, streamText: \"\", modelOpen: false, replyIdx: s.replyIdx + 1\n    }));\n    let i = 0;\n    clearInterval(this.stream);\n    this.stream = setInterval(() => {\n      i += 3;\n      if (i >= reply.length) {\n        clearInterval(this.stream);\n        this.setState(s => ({\n          streaming: false, streamText: \"\",\n          messages: s.messages.concat([{ role: \"bot\", text: reply, time: new Date().toTimeString().slice(0, 5) }])\n        }));\n      } else this.setState({ streamText: reply.slice(0, i) });\n    }, 18);\n  };\n\n  renderVals() {\n    const s = this.state;\n    const theme = s.theme || this.props.theme || \"light\";\n\n    const chatData = [\n      { title: \"Eval sweep · tuber-7b\", meta: \"gsm8k regression · 3m ago\", live: true },\n      { title: \"Prompt cache benchmark\", meta: \"12 runs · 1h ago\" },\n      { title: \"Tokenizer diff v2.3 → v2.4\", meta: \"closed · yesterday\" },\n      { title: \"Distill 70b → 7b plan\", meta: \"draft · yesterday\" },\n      { title: \"Router latency spike\", meta: \"resolved · 2d ago\" },\n      { title: \"Synthetic conversion chains\", meta: \"queued · 3d ago\" },\n      { title: \"Red-team pass 04\", meta: \"closed · 5d ago\" }\n    ];\n    const q = s.query.trim().toLowerCase();\n    const chats = chatData\n      .map((c, i) => ({ ...c, i }))\n      .filter(c => !q || c.title.toLowerCase().includes(q))\n      .filter(c => s.filter !== 2 || c.live)\n      .map(c => ({\n        title: c.title,\n        select: () => this.setState({ activeChat: c.i }),\n        menu: e => { e.stopPropagation(); },\n        style: {\n          display: \"flex\", alignItems: \"center\", gap: 8, padding: \"5px 7px 5px 9px\", borderRadius: 7,\n          cursor: \"pointer\", transition: \"background .16s ease\",\n          background: s.activeChat === c.i ? \"var(--pot-raised)\" : \"transparent\",\n          boxShadow: s.activeChat === c.i ? \"inset 2px 0 0 var(--pot-accent-dot)\" : \"none\",\n          animation: \"potRowIn .3s ease both\", animationDelay: (c.i * 24) + \"ms\"\n        }\n      }));\n\n    const models = [\n      { name: \"potato-2 · large\", spec: \"128k ctx · 42 tok/s\", badge: \"default\" },\n      { name: \"potato-2 · flash\", spec: \"32k ctx · 180 tok/s\", badge: \"fast\" },\n      { name: \"tuber-7b · local\", spec: \"8k ctx · on-device\", badge: \"free\" },\n      { name: \"russet-mini\", spec: \"16k ctx · 96 tok/s\", badge: \"cheap\" }\n    ].map(m => ({\n      ...m,\n      mark: s.model === m.name ? \"▪\" : \"·\",\n      markStyle: { fontFamily: \"'JetBrains Mono', monospace\", fontSize: 11, width: 10, color: s.model === m.name ? \"var(--pot-accent-ink)\" : \"var(--pot-ghost)\" },\n      pick: () => this.setState({ model: m.name, modelOpen: false }),\n      style: {\n        display: \"flex\", alignItems: \"center\", gap: 8, padding: \"10px 12px\", cursor: \"pointer\",\n        borderTop: \"1px solid var(--pot-line)\", transition: \"background .15s ease\",\n        background: s.model === m.name ? \"var(--pot-accent-soft)\" : \"transparent\"\n      }\n    }));\n\n    const P = [\n      { key: \"temp\", label: \"Temperature\", min: 0, max: 2, step: 0.05, dec: 2 },\n      { key: \"topP\", label: \"Top P\", min: 0, max: 1, step: 0.01, dec: 2 },\n      { key: \"topK\", label: \"Top K\", min: 1, max: 100, step: 1, dec: 0 },\n      { key: \"maxTokens\", label: \"Max tokens\", min: 256, max: 8192, step: 256, dec: 0 }\n    ].map(p => {\n      const v = s[p.key];\n      const frac = (v - p.min) / (p.max - p.min);\n      const N = 26;\n      const filled = Math.round(frac * N);\n      const set = x => {\n        const raw = p.min + Math.max(0, Math.min(1, x)) * (p.max - p.min);\n        const snapped = Math.round(raw / p.step) * p.step;\n        this.setState({ [p.key]: parseFloat(snapped.toFixed(4)) });\n      };\n      const fromEvent = e => {\n        const r = e.currentTarget.getBoundingClientRect();\n        set((e.clientX - r.left) / r.width);\n      };\n      const cell = {\n        height: 14, pointerEvents: \"none\", flex: \"0 0 auto\",\n        transition: \"width .12s ease-out, background-image .18s ease\"\n      };\n      return {\n        label: p.label,\n        display: p.dec ? v.toFixed(p.dec) : String(v),\n        minLabel: p.dec ? p.min.toFixed(p.dec) : String(p.min),\n        maxLabel: p.dec ? p.max.toFixed(p.dec) : String(p.max),\n        valueStyle: {\n          fontFamily: \"'IBM Plex Mono', monospace\", fontSize: 11.5, fontWeight: 600, letterSpacing: -.2,\n          background: \"var(--pot-accent-soft)\", border: \"1px solid var(--pot-accent-line)\",\n          borderRadius: 5, padding: \"1px 7px\", transition: \"background .18s ease\"\n        },\n        filledStyle: {\n          ...cell, width: (frac * 100) + \"%\",\n          backgroundImage: \"repeating-linear-gradient(90deg, var(--pot-ink) 0 2px, transparent 2px 7px)\"\n        },\n        emptyStyle: {\n          ...cell, flex: \"1 1 auto\", width: \"auto\",\n          backgroundImage: \"repeating-linear-gradient(90deg, var(--pot-ghost) 0 2px, transparent 2px 7px)\"\n        },\n        knobStyle: {\n          position: \"absolute\", top: \"50%\", left: (frac * 100) + \"%\",\n          width: 3, height: 20, marginLeft: -1.5, borderRadius: 2,\n          background: \"var(--pot-accent-dot)\", pointerEvents: \"none\",\n          transform: \"translateY(-50%)\", transition: \"left .12s ease-out\"\n        },\n        onDown: e => { e.currentTarget.setPointerCapture(e.pointerId); fromEvent(e); },\n        onMove: e => { if (e.buttons === 1) fromEvent(e); }\n      };\n    });\n\n    const messages = s.messages.map((m, i) => {\n      const user = m.role === \"user\";\n      return {\n        text: m.text, time: m.time, tag: user ? \"YOU\" : \"\",\n        wrapStyle: {\n          alignSelf: user ? \"flex-end\" : \"flex-start\", maxWidth: \"88%\",\n          display: \"flex\", flexDirection: \"column\", alignItems: user ? \"flex-end\" : \"flex-start\",\n          animation: \"potFadeUp .38s cubic-bezier(.2,.9,.3,1) both\", animationDelay: Math.min(i * 40, 240) + \"ms\"\n        },\n        headStyle: { display: \"flex\", alignItems: \"center\", gap: 8, marginBottom: user ? 7 : 5 },\n        tagStyle: user\n          ? { fontSize: 9.5, fontWeight: 700, letterSpacing: 1.2, padding: \"2px 6px\", borderRadius: 4, color: \"var(--pot-sub)\", background: \"var(--pot-raised)\", border: \"1px solid var(--pot-line-strong)\" }\n          : { display: \"none\" },\n        bubbleStyle: user\n          ? { fontSize: 14, lineHeight: 1.55, color: \"var(--pot-ink)\", background: \"var(--pot-raised)\", border: \"1px solid var(--pot-line-strong)\", borderRadius: \"14px 14px 4px 14px\", padding: \"11px 14px\", whiteSpace: \"pre-wrap\" }\n          : { fontSize: 14, lineHeight: 1.62, color: \"var(--pot-ink-soft)\", whiteSpace: \"pre-wrap\" }\n      };\n    });\n\n    const filters = [\"ALL TASKS\", \"CHATS\", \"RUNNING\"];\n\n    return {\n      theme,\n      themeIcon: theme === \"dark\" ? \"☀\" : \"☾\",\n      toggleTheme: () => this.setState({ theme: theme === \"dark\" ? \"light\" : \"dark\" }),\n      sidebarOpen: s.sidebarOpen, modelOpen: s.modelOpen, streaming: s.streaming,\n      streamText: s.streamText, draft: s.draft, query: s.query, model: s.model,\n      messages, models, params: P, chats, sysPrompt: s.sysPrompt,\n      spinner: SPIN[s.tick % 4],\n      sidebarIcon: s.sidebarOpen ? \"«\" : \"»\",\n      sidebarStyle: {\n        width: s.sidebarOpen ? 288 : 52, flex: \"0 0 auto\", display: \"flex\", flexDirection: \"column\",\n        borderRight: \"1px solid var(--pot-line)\", background: \"var(--pot-panel)\", overflow: \"hidden\",\n        transition: \"width .34s cubic-bezier(.4,0,.2,1)\"\n      },\n      pinned: [\n        { title: \"Eval sweep · tuber-7b\", select: () => this.setState({ activeChat: 0 }) },\n        { title: \"Nightly regression board\", select: () => this.setState({ activeChat: 0 }) }\n      ].map(p => ({ ...p, style: { display: \"flex\", alignItems: \"center\", gap: 8, padding: \"5px 7px 5px 9px\", borderRadius: 7, cursor: \"pointer\", transition: \"background .16s ease\" } })),\n      filterLabel: filters[s.filter],\n      chatCount: chats.length + \"/\" + chatData.length,\n      cycleFilter: () => this.setState(st => ({ filter: (st.filter + 1) % 3 })),\n      onQuery: e => this.setState({ query: e.target.value }),\n      toggleSidebar: () => this.setState(st => ({ sidebarOpen: !st.sidebarOpen })),\n      usagePct: 68,\n      noop: () => {},\n      activeTitle: chatData[s.activeChat] ? chatData[s.activeChat].title : \"New task\",\n      activeMeta: \"#\" + (1024 + s.activeChat) + \" · \" + s.messages.length + \" turns\",\n      toggleTerminal: () => this.setState(st => ({ monitorOpen: !st.monitorOpen })),\n      onDraft: e => this.setState({ draft: e.target.value }),\n      onKey: e => { if (e.key === \"Enter\" && !e.shiftKey) { e.preventDefault(); this.send(); } },\n      onFocus: () => this.setState({ focused: true }),\n      onBlur: () => this.setState({ focused: false }),\n      composerStyle: {\n        border: \"1px solid \" + (s.focused ? \"var(--pot-accent-edge)\" : \"var(--pot-line-strong)\"), borderRadius: 14,\n        background: \"var(--pot-bg)\",\n        boxShadow: s.focused ? \"0 10px 30px -18px rgba(0,0,0,.45)\" : \"0 4px 18px -16px rgba(0,0,0,.5)\",\n        transition: \"border-color .2s ease, box-shadow .25s ease\"\n      },\n      draftMeta: s.draft.length ? \"~\" + Math.max(1, Math.round(s.draft.length / 4)) + \" tok · ⏎ to send\" : \"⇧⏎ newline\",\n      toggleModel: () => this.setState(st => ({ modelOpen: !st.modelOpen })),\n      modelBtnStyle: {\n        display: \"flex\", alignItems: \"center\", gap: 7, height: 30, padding: \"0 10px\", borderRadius: 8, cursor: \"pointer\",\n        border: \"1px solid \" + (s.modelOpen ? \"var(--pot-accent-edge)\" : \"var(--pot-line-strong)\"),\n        background: s.modelOpen ? \"var(--pot-accent-soft)\" : \"var(--pot-bg)\",\n        fontSize: 11.5, fontWeight: 600, color: \"var(--pot-ink-soft)\", transition: \"background .18s ease, border-color .18s ease\"\n      },\n      caretStyle: { fontSize: 9, color: \"var(--pot-sub)\", transition: \"transform .24s cubic-bezier(.2,.9,.3,1)\", transform: s.modelOpen ? \"rotate(180deg)\" : \"none\" },\n      send: this.send,\n      sendStyle: {\n        width: 34, height: 30, flex: \"0 0 34px\", display: \"grid\", placeItems: \"center\", borderRadius: 8, cursor: \"pointer\",\n        border: \"1px solid \" + (s.draft.trim() ? \"var(--pot-accent-edge)\" : \"var(--pot-line-strong)\"),\n        background: s.draft.trim() ? \"var(--pot-accent)\" : \"var(--pot-raised)\",\n        color: s.draft.trim() ? \"#0d0d0d\" : \"var(--pot-ghost)\",\n        transition: \"background .2s ease, color .2s ease, transform .18s ease, border-color .2s ease\"\n      },\n      statusDotStyle: {\n        width: 7, height: 7, flex: \"0 0 7px\", borderRadius: \"50%\",\n        background: s.streaming ? \"var(--pot-accent-dot)\" : \"var(--pot-ok)\",\n        transition: \"background .25s ease\"\n      },\n      statusLabelStyle: s.streaming\n        ? { fontWeight: 700, fontSize: 11, letterSpacing: .3, backgroundImage: \"linear-gradient(90deg, var(--pot-faint) 0%, var(--pot-faint) 38%, var(--pot-ink) 50%, var(--pot-faint) 62%, var(--pot-faint) 100%)\", backgroundSize: \"220% 100%\", WebkitBackgroundClip: \"text\", backgroundClip: \"text\", color: \"transparent\", animation: \"potTextGlow 1.6s linear infinite\" }\n        : { fontWeight: 700, fontSize: 11, letterSpacing: .3, color: \"var(--pot-ink)\" },\n      monitorTitleStyle: s.streaming\n        ? { fontSize: 10, fontWeight: 800, letterSpacing: 1.4, backgroundImage: \"linear-gradient(90deg, var(--pot-faint) 0%, var(--pot-faint) 38%, var(--pot-ink) 50%, var(--pot-faint) 62%, var(--pot-faint) 100%)\", backgroundSize: \"220% 100%\", WebkitBackgroundClip: \"text\", backgroundClip: \"text\", color: \"transparent\", animation: \"potTextGlow 1.6s linear infinite\" }\n        : { fontSize: 10, fontWeight: 800, letterSpacing: 1.4, color: \"var(--pot-ink)\" },\n      statusLabel: s.streaming ? \"GENERATING\" : \"READY\",\n      statusModel: s.model.replace(\" · \", \"/\"),\n      sparkline: this.spark(22),\n      statusTps: (s.streaming ? 41.8 : 0).toFixed(1) + \" tok/s\",\n      statusCtx: \"ctx 4,812 / 128k · t=\" + s.temp.toFixed(2),\n      monitorChevron: s.monitorOpen ? \"›\" : \"‹\",\n      toggleMonitor: () => this.setState(st => ({ monitorOpen: !st.monitorOpen })),\n      handleStyle: {\n        position: \"absolute\", left: -22, top: \"50%\", transform: \"translateY(-50%)\", width: 22, height: 86,\n        border: \"1px solid var(--pot-status-line)\", borderRight: 0, borderRadius: \"9px 0 0 9px\",\n        background: \"var(--pot-panel)\", cursor: \"pointer\", color: \"var(--pot-sub)\",\n        fontFamily: \"'JetBrains Mono', monospace\", fontSize: 12,\n        display: \"grid\", placeItems: \"center\", zIndex: 5, transition: \"background .2s ease, color .2s ease\"\n      },\n      handleIcon: s.monitorOpen ? \"›\" : \"‹\",\n      monitorStyle: {\n        width: s.monitorOpen ? 380 : 0, flex: \"0 0 auto\", overflow: \"hidden\",\n        borderLeft: s.monitorOpen ? \"1px solid var(--pot-line)\" : \"0\", background: \"var(--pot-bg)\",\n        opacity: s.monitorOpen ? 1 : 0,\n        transition: \"width .38s cubic-bezier(.4,0,.2,1), opacity .3s ease\"\n      },\n      onSysPrompt: e => this.setState({ sysPrompt: e.target.value }),\n      bigSpark: this.spark(30),\n      tps: (s.streaming ? 41.8 : 0).toFixed(1),\n      ttft: 218, p95: 604, uptime: \"up 4h 12m\",\n      stats: [\n        { k: \"REQUESTS\", v: \"1,284\" },\n        { k: \"CACHE HIT\", v: \"72%\" },\n        { k: \"GPU\", v: \"61%\" },\n        { k: \"VRAM\", v: \"18.4G\" }\n      ]\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
